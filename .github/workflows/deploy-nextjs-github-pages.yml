name: Deploy Next.js to GitHub Pages (branch nextjs)

on:
  push:
    branches: [ 'nextjs' ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build --if-present

      - name: Export static site (if supported)
        run: |
          set -e
          # prefer an explicit `npm run export` script if present
          if npm run | grep -q " export"; then
            npm run export
            echo "Exported via npm script"
          else
            # attempt next export; harmless if not supported
            npx next export -o out || true
          fi

      - name: Prepare output folder
        run: |
          # many Next.js exports place files into `out` by default
          if [ -d out ]; then
            echo "Using ./out as publish dir"
          elif [ -d .next ]; then
            # fallback: try to copy a static build if available
            mkdir -p out
            cp -r .next/static out/ || true
          else
            mkdir -p out
            echo "No static export found; out will be empty"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
